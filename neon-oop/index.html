<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a14">
  <title>NEON//OOP: Protocolo Nexus</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/theme-cyberpunk.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <!-- Fondo animado y scanlines (decorativos) -->
  <div id="lluvia" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <!-- Contenedor de pantallas -->
  <main id="app" tabindex="-1"></main>

  <!-- Capas globales: modales y avisos (aria-live) -->
  <div id="modales"></div>
  <div id="toasts" role="status" aria-live="polite"></div>

  <noscript><p style="padding:2rem;color:#fff">NEON//OOP necesita JavaScript activado.</p></noscript>

  <!-- Scripts clásicos con namespace global NEON (los módulos ES no funcionan en file://) -->
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>   <!-- utilidades NEON.ui y router; el arranque espera a DOMContentLoaded -->
  <script src="js/storage.js"></script>
  <script src="js/state.js"></script>

  <script src="js/data/avatars.js"></script>
  <script src="js/data/narrative.js"></script>
  <script src="js/data/levels/abstraccion.js"></script>
  <script src="js/data/levels/encapsulamiento.js"></script>
  <script src="js/data/levels/herencia.js"></script>
  <script src="js/data/levels/polimorfismo.js"></script>

  <script src="js/engine/lives.js"></script>
  <script src="js/engine/scoring.js"></script>
  <script src="js/engine/validator.js"></script>
  <script src="js/engine/dragdrop.js"></script>

  <script src="js/exercises/dragCode.js"></script>
  <script src="js/exercises/multipleChoice.js"></script>
  <script src="js/exercises/orderCode.js"></script>

  <script src="js/screens/intro.js"></script>
  <script src="js/screens/profile.js"></script>
  <script src="js/screens/map.js"></script>
  <script src="js/screens/level.js"></script>
  <script src="js/screens/results.js"></script>
  <script src="js/screens/ranking.js"></script>

</body>
</html>
